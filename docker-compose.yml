# ============================================================
# Sobe TUDO num servidor só (VPS): Júria + Evolution API + banco/redis
# da Evolution. O banco da Júria continua no Supabase (nuvem).
#
# Uso (num VPS com Docker instalado):
#   1. cp .env.example .env   e preencha
#   2. docker compose up -d --build
#   3. veja os logs:  docker compose logs -f juria
# ============================================================
services:
  # -------- Banco da Evolution (interno) --------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # -------- Cache da Evolution (interno) --------
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  # -------- Evolution API (motor do WhatsApp) --------
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    ports:
      # Acessível apenas de dentro do servidor (localhost). O QR Code é
      # gerado pelo painel da Júria; o manager da Evolution não fica público.
      - "127.0.0.1:8081:8080"
    volumes:
      - evolution_instances:/evolution/instances

  # -------- Júria (este app) --------
  juria:
    build: .
    restart: always
    depends_on:
      - evolution
    env_file:
      - .env
    environment:
      # Dentro da rede do Docker, os serviços se enxergam pelo nome.
      NODE_ENV: production
      PORT: "8080"
      EVOLUTION_API_URL: http://evolution:8080
      PUBLIC_URL: http://juria:8080
    ports:
      # Acessível apenas de dentro do servidor (localhost) e via HTTPS pelo
      # Caddy (https://DOMINIO). A porta não fica mais aberta na internet.
      - "127.0.0.1:8080:8080"

  # -------- HTTPS (Caddy) --------
  # Emite e renova o certificado sozinho (Let's Encrypt) para o domínio
  # definido em DOMINIO no .env. Sem DOMINIO definido, fica inerte.
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - juria
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC) — sem isso, navegadores que insistem no QUIC falham
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  caddy_data:
  caddy_config:
