# ============================================================
# Sobe TUDO num servidor só (VPS): Júria + Evolution API + banco/redis
# da Evolution. O banco da Júria continua no Supabase (nuvem).
#
# Uso (num VPS com Docker instalado):
#   1. cp .env.example .env   e preencha
#   2. docker compose up -d --build
#   3. veja os logs:  docker compose logs -f juria
# ============================================================
services:
  # -------- Banco da Evolution (interno) --------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # -------- Cache da Evolution (interno) --------
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  # -------- Evolution API (motor do WhatsApp) --------
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    ports:
      - "8081:8080" # painel/manager da Evolution acessível em http://SEU_IP:8081
    volumes:
      - evolution_instances:/evolution/instances

  # -------- Júria (este app) --------
  juria:
    build: .
    restart: always
    depends_on:
      - evolution
    env_file:
      - .env
    environment:
      # Dentro da rede do Docker, os serviços se enxergam pelo nome.
      NODE_ENV: production
      PORT: "8080"
      EVOLUTION_API_URL: http://evolution:8080
      PUBLIC_URL: http://juria:8080
    ports:
      - "8080:8080" # a Júria (rotas /admin e /webhook) em http://SEU_IP:8080

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
